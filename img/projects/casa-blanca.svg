  </g>
  <g transform="translate(390, 380)">
    <rect width="60" height="24" rx="4" fill="#8b5cf6"/>
    <text x="30" y="16" font-family="Inter, sans-serif" font-size="10" fill="white" text-anchor="middle">Cena</text>
  </g>
  <g transform="translate(460, 380)">
