<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a25"/>
      <stop offset="100%" style="stop-color:#12121a"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Plate icon -->
  <g transform="translate(340, 120)">
    <ellipse cx="60" cy="60" rx="60" ry="20" fill="#374151"/>
    <ellipse cx="60" cy="50" rx="50" ry="15" fill="#4b5563"/>
    <circle cx="60" cy="45" r="25" fill="#f3f4f6"/>
  </g>
  
  <text x="400" y="300" font-family="Inter, sans-serif" font-size="36" font-weight="700" fill="white" text-anchor="middle">Casa Blanca</text>
  <text x="400" y="340" font-family="Inter, sans-serif" font-size="18" fill="#a0a0b0" text-anchor="middle">Menú digital completo</text>
  
  <!-- Menu sections -->
  <g transform="translate(220, 380)">
    <rect width="80" height="24" rx="4" fill="#f59e0b"/>
    <text x="40" y="16" font-family="Inter, sans-serif" font-size="10" fill="white" text-anchor="middle">Desayunos</text>
  </g>
  <g transform="translate(310, 380)">
