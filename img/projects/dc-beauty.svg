<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a25"/>
      <stop offset="100%" style="stop-color:#12121a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#f472b6"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Nails icon -->
  <g transform="translate(360, 120)">
    <ellipse cx="40" cy="80" rx="30" ry="50" fill="url(#accent)" opacity="0.8"/>
    <ellipse cx="40" cy="30" rx="20" ry="40" fill="#fce7f3"/>
  </g>
  
  <text x="400" y="300" font-family="Inter, sans-serif" font-size="36" font-weight="700" fill="white" text-anchor="middle">DC Beauty</text>
  <text x="400" y="340" font-family="Inter, sans-serif" font-size="18" fill="#a0a0b0" text-anchor="middle">Catálogo + Calculadora de precios</text>
  
  <!-- Features -->
  <g transform="translate(250, 380)">
    <rect width="100" height="24" rx="4" fill="#ec4899"/>
    <text x="50" y="16" font-family="Inter, sans-serif" font-size="10" fill="white" text-anchor="middle">Catálogo</text>
  </g>
  <g transform="translate(360, 380)">
    <rect width="100" height="24" rx="4" fill="#8b5cf6"/>
    <text x="50" y="16" font-family="Inter, sans-serif" font-size="10" fill="white" text-anchor="middle">Calculadora</text>
  </g>
  <g transform="translate(470, 380)">
    <rect width="80" height="24" rx="4" fill="#22d3ee"/>
    <text x="40" y="16" font-family="Inter, sans-serif" font-size="10" fill="white" text-anchor="middle">WhatsApp</text>
  </g>
</svg>
