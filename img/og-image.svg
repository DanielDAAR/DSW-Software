<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#12121a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Glow -->
  <circle cx="600" cy="315" r="300" fill="rgba(99,102,241,0.1)"/>
  
  <!-- Logo mark -->
  <rect x="540" y="180" width="120" height="120" rx="20" fill="url(#accent)"/>
  <text x="600" y="255" font-family="Inter, sans-serif" font-size="48" font-weight="700" fill="white" text-anchor="middle">DS</text>
  
  <!-- Title -->
  <text x="600" y="350" font-family="Inter, sans-serif" font-size="48" font-weight="700" fill="white" text-anchor="middle">D.Softworks</text>
  
  <!-- Subtitle -->
  <text x="600" y="400" font-family="Inter, sans-serif" font-size="24" fill="#a0a0b0" text-anchor="middle">Desarrollo de Software y Soluciones Digitales</text>
  
  <!-- URL -->
  <text x="600" y="550" font-family="JetBrains Mono, monospace" font-size="18" fill="#6b6b7b" text-anchor="middle">dsoftworks.netlify.app</text>
</svg>
